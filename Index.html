<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" href="google.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="header">
            <div id="header-left">
                <a href="https://about.google/">About</a>
                <a href="https://store.google.com/">Store</a>
            </div>
            <div id="header-right">
                <a href="https://mail.google.com/">Gmail</a>
                <a href="https://www.google.com/imghp">Images</a>
                <a href="https://accounts.google.com" id="sign-in-btn">Sign in</a>
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main>
        <div id="Main-center">
            <a href="https://www.google.com">
                <img src="google.png" alt="Google Logo" id="google-Heading">
            </a>

            <form action="https://www.google.com/search" method="get">
                <div class="search-box">
                    <input type="text" name="q" placeholder="Search Google or type a URL">
                </div>
                <div class="buttons">
                    <button type="submit">Google Search</button>
                    <button type="submit" name="btnI">I'm Feeling Lucky</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <div id="footer-left">
            <a href="https://about.google/">About</a>
            <a href="https://www.google.com/services/">Business</a>
            <a href="https://google.com/search/howsearchworks/">How Search works</a>
        </div>
        <div id="footer-right">
            <a href="https://policies.google.com/privacy">Privacy</a>
            <a href="https://policies.google.com/terms">Terms</a>
            <a href="https://www.google.com/preferences">Settings</a>
        </div>
    </footer>

</body>
</html>
