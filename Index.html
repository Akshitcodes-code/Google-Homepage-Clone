<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="google.jpg">
    <title>google.com</title>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="items">
                <div id="left">
                    <a href="https://about.google/?fg=1&utm_source=google-IN&utm_medium=referral&utm_campaign=hp-header" target="_self">About</a>
                    <a href="https://store.google.com/in/?utm_source=hp_header&utm_medium=google_ooo&utm_campaign=GS100042&hl=en-IN&pli=1" target="_self">Store</a>
                </div>
                <div id="right">
                    <a href="https://mail.google.com/mail/u/0/" target="_self">Mail</a>
                    <a href="https://www.google.com/imghp?hl=en&ogbl" target="_self">Images</a>
                </div>
            </div>  
        </div>
    </header>
    <main>
        <div class="main-section">
            <div class="logo">
                <a href="https://www.google.com">
                    <img src="google.png" alt="A google logo" id="google-logo">
                </a>
            </div>
        <form action="https://www.google.com/search" method="GET">

            <div class="search-bar">

                <button type="submit" class="search-icon"
                        aria-label="Search">
                    <svg viewBox="0 0 24 24">
                        <circle cx="10.5" cy="10.5" r="6.5"/>
                        <path d="m15.5 15.5 5 5"/>
                    </svg>
                </button>

                <input
                    type="text"
                    name="q"
                    placeholder="Search Google or type a URL"
                    aria-label="Search Google"
                    autocomplete="off"
                >

                <button type="button" class="tool-icon"
                        aria-label="Voice search">
                    <svg viewBox="0 0 24 24">
                        <rect x="9" y="3" width="6" height="12" rx="3"/>
                        <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
                        <path d="M12 18v3m-3 0h6"/>
                    </svg>
                </button>

                <button type="button" class="tool-icon"
                        aria-label="Image search">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="6" width="18" height="15" rx="3"/>
                        <circle cx="12" cy="13.5" r="3.5"/>
                        <path d="m8 6 1.5-3h5L16 6"/>
                    </svg>
                </button>

            </div>

            <div class="buttons">
                <button type="submit">Google Search</button>
                <button type="button"
                        onclick="window.location.href='https://doodles.google/'">
                    I'm Feeling Lucky
                </button>
            </div>

        </form>
    </main>

    <footer>
        <div class="footer-nav">
            <div id="left">
                <div id="Adv">
                    <a href="#">Advertising</a>
                </div>
                <div id="Bu">
                    <a href="#">Buisness</a>
                </div>
                <div>
                    <a href="#">How Search Works</a>
                </div>
            </div>
            <div id="right">  
                <div>
                    <a href="#">Privacy</a>
                </div>
                <div>
                    <a href="#">Terms</a>
                </div>
                <div>
                    <a href="#">Settings</a>
                </div>
            </div>
        </div>
    </footer>
	
</body>
</html>
